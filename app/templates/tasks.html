{% extends "base.html" %}
{% block title %}tasks {% endblock %}
{% block content %}

<div class ="task-box">
    <h2>your tasks</h2>
    <form action="{{ url_for('tasks.add_task')}}" method="POST" class="task-form">
        <input type="text" name="title" placeholder="New task" required>
        <button type="submit" class="btn">add</button>
    </form>
</div>
{% if tasks %}
<form method="POST" action="{{url_for('tasks.clear_tasks') }}">
    <button type="submit" class="btn btn-clear">Clear All Tasks</button>
</form>
<br>
<table class="task-table">
    <thead>
        <tr>
            <th>Task</th>
            <th>Status</th>
            <th>Change</th>
        </tr>
    </thead>
    <tbody>
        {% for task in  tasks %}
        <tr>
            <td>{{ task.title }}</td>
            <td><span class="badge {{ task.status|lower}}">{{ task.status }}</span></td>
            </td>
            <td>
                 <form action="{{url_for('tasks.toggle_status', task_id=task.id) }}" method="POST">
                     <button class="btn-small" type="submit">Next</button>
                 </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>

</table>
{% else %}
    <p>No tasks available. this website one you can add tasks.</p>
{% endif %}
{% endblock %}
